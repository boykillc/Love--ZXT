name: Daily Love Weather

on:
  workflow_dispatch:
  schedule:
    - cron: "10 17 * * *"
      timezone: "Asia/Shanghai"
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "assets/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/main.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  publish-and-notify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build today's page
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: python main.py --build-only

      - name: Copy Lulu fallbacks into site
        run: |
          mkdir -p _site/assets
          cp -f assets/lulu-bg.jpg _site/assets/lulu-bg.jpg
          cp -f assets/lulu-*.gif _site/assets/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send WeChat notification
        if: github.event_name != 'push'
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python main.py --notify-only
